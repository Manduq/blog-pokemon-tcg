<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300"><rect width="680" height="300" fill="#f4f4f2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">
<rect x="230" y="20" width="220" height="64" rx="32" fill="#2f3540"/><text x="340" y="58" fill="#fff" font-weight="700">¿Qué buscas?</text>
<path d="M300 84L150 180M380 84l150 96" stroke="#1d2027" stroke-width="2.5" fill="none"/>
<text x="190" y="128" font-size="14" fill="#5b606b">Una carta concreta</text><text x="500" y="128" font-size="14" fill="#5b606b">El set o el rato</text>
<rect x="40" y="180" width="230" height="84" rx="10" fill="#cbb27a"/><text x="155" y="216" font-weight="700" fill="#1d2027">Cómprala suelta</text><text x="155" y="242" font-size="14" fill="#1d2027">Más barato y eliges el centrado</text>
<rect x="410" y="180" width="230" height="84" rx="10" fill="#8c3a33"/><text x="525" y="216" font-weight="700" fill="#fff">Abre sobres</text><text x="525" y="242" font-size="14" fill="#fff">Con presupuesto cerrado</text>
</g></svg>
